<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="T&uuml;rkiye i&ccedil;in g&uuml;ncel hava durumu, 7 g&uuml;nl&uuml;k tahmin, r&uuml;zgar ve ya&gbreve;&inodot;&scedil; olas&inodot;l&inodot;&gbreve;&inodot;.">
  <title>Hava Durumu | hakancetin.com.tr</title>
  <style>
    :root { --red:#e10600; --dark:#171729; --text:#20242a; --muted:#667085; --bg:#f4f6f8; --border:#e5e7eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--text); }
    .top { background:var(--dark); color:#fff; }
    .top .inner { max-width:1100px; margin:0 auto; padding:10px 18px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
    a { color:inherit; text-decoration:none; }
    .brand { font-weight:900; }
    .back { color:#fff; font-weight:800; }
    .wrap { max-width:1100px; margin:28px auto; padding:0 18px; }
    .hero { background:linear-gradient(135deg, #e10600, #a80000); color:#fff; border-radius:12px; padding:24px; box-shadow:0 18px 40px rgba(225,6,0,.18); }
    h1 { margin:0 0 8px; font-size:clamp(1.8rem,3vw,2.7rem); }
    .meta { margin:0; opacity:.88; }
    .tools { display:flex; gap:10px; flex-wrap:wrap; margin:18px 0; }
    .tools button { border:1px solid var(--border); background:#fff; color:var(--dark); border-radius:999px; padding:10px 14px; font-weight:800; cursor:pointer; }
    .tools button.active { background:var(--dark); color:#fff; border-color:var(--dark); }
    .panel { background:#fff; border:1px solid var(--border); border-radius:12px; padding:18px; box-shadow:0 10px 28px rgba(15,23,42,.06); }
    .current { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; margin-bottom:16px; }
    .big-temp { font-size:3rem; font-weight:900; color:var(--red); line-height:1; }
    .summary { color:var(--muted); line-height:1.6; }
    .grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; }
    .day { border:1px solid var(--border); border-radius:10px; padding:12px; background:#fff; min-height:130px; }
    .day strong { display:block; margin-bottom:8px; color:var(--dark); }
    .day .max { color:var(--red); font-size:1.25rem; font-weight:900; }
    .day .min, .day .rain { color:var(--muted); font-size:.88rem; margin-top:5px; }
    .error { color:#b42318; font-weight:800; }
    @media (max-width:800px){ .current{grid-template-columns:1fr;} .grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
    @media (max-width:520px){ .grid{grid-template-columns:1fr;} .hero{padding:20px;} }
  </style>
</head>
<body>
  <div class="top"><div class="inner"><a class="brand" href="haber/">hakancetin.com.tr</a><a class="back" href="haber/">&larr; Haberler</a></div></div>
  <main class="wrap">
    <section class="hero">
      <h1 id="title">Hava Durumu</h1>
      <p class="meta" id="updated">G&uuml;ncel tahminler y&uuml;kleniyor...</p>
    </section>
    <div class="tools" id="city-buttons"></div>
    <section class="panel">
      <div class="current">
        <div>
          <div class="big-temp" id="current-temp">--&deg;</div>
          <p class="summary" id="current-summary">Anl&inodot;k s&inodot;cakl&inodot;k, r&uuml;zgar ve 7 g&uuml;nl&uuml;k tahmin bilgisi burada g&ouml;r&uuml;n&uuml;r.</p>
        </div>
        <div class="summary" id="current-extra"></div>
      </div>
      <div class="grid" id="detail-grid"></div>
    </section>
  </main>
  <script>
    const cities = {
      Istanbul:{label:'Istanbul',lat:41.0082,lon:28.9784}, Ankara:{label:'Ankara',lat:39.9334,lon:32.8597}, Izmir:{label:'Izmir',lat:38.4237,lon:27.1428}, Bursa:{label:'Bursa',lat:40.1828,lon:29.0663}, Antalya:{label:'Antalya',lat:36.8969,lon:30.7133}
    };
    const weatherCodes = {0:'A&ccedil;&inodot;k',1:'Az bulutlu',2:'Par&ccedil;al&inodot; bulutlu',3:'Bulutlu',45:'Sisli',48:'Sisli',51:'Hafif &ccedil;ise',61:'Ya&gbreve;murlu',63:'Ya&gbreve;murlu',65:'Kuvvetli ya&gbreve;mur',71:'Karla kar&inodot;&scedil;&inodot;k',80:'Sa&gbreve;anak',95:'G&ouml;k g&uuml;r&uuml;lt&uuml;l&uuml;'};
    const params = new URLSearchParams(location.search);
    let selected = cities[params.get('city')] ? params.get('city') : 'Istanbul';
    const buttons = document.getElementById('city-buttons');
    Object.keys(cities).forEach(key => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = cities[key].label;
      btn.addEventListener('click', () => { selected = key; loadWeather(); history.replaceState(null, '', '?city=' + encodeURIComponent(key)); });
      btn.dataset.city = key;
      buttons.appendChild(btn);
    });
    function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    async function loadWeather(){
      const city = cities[selected];
      document.querySelectorAll('#city-buttons button').forEach(btn => btn.classList.toggle('active', btn.dataset.city === selected));
      document.getElementById('title').textContent = city.label + ' Hava Durumu';
      document.getElementById('updated').innerHTML = 'G&uuml;ncel tahminler y&uuml;kleniyor...';
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=Europe%2FIstanbul`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('weather');
      const data = await res.json();
      const current = data.current || {};
      const daily = data.daily || {};
      const code = current.weather_code;
      document.getElementById('current-temp').innerHTML = `${Math.round(current.temperature_2m ?? 0)}&deg;`;
      document.getElementById('current-summary').innerHTML = `${weatherCodes[code] || 'G&uuml;ncel durum'}; r&uuml;zgar ${Math.round(current.wind_speed_10m ?? 0)} km/sa.`;
      document.getElementById('current-extra').innerHTML = `<strong>Bug&uuml;n</strong><br>En y&uuml;ksek: ${Math.round((daily.temperature_2m_max||[])[0] ?? 0)}&deg;<br>En d&uuml;&scedil;&uuml;k: ${Math.round((daily.temperature_2m_min||[])[0] ?? 0)}&deg;<br>Ya&gbreve;&inodot;&scedil; olas&inodot;l&inodot;&gbreve;&inodot;: ${Math.round((daily.precipitation_probability_max||[])[0] ?? 0)}%`;
      const rows = (daily.time || []).slice(0,7).map((day,i) => {
        const label = new Date(day + 'T12:00:00').toLocaleDateString('tr-TR', { weekday:'short', day:'2-digit', month:'short' });
        return `<div class="day"><strong>${esc(label)}</strong><div class="max">${Math.round((daily.temperature_2m_max||[])[i] ?? 0)}&deg;</div><div class="min">Gece ${Math.round((daily.temperature_2m_min||[])[i] ?? 0)}&deg;</div><div class="rain">Ya&gbreve;&inodot;&scedil; ${(daily.precipitation_probability_max||[])[i] ?? 0}%</div><div class="rain">${weatherCodes[(daily.weather_code||[])[i]] || ''}</div></div>`;
      });
      document.getElementById('detail-grid').innerHTML = rows.join('');
      document.getElementById('updated').textContent = new Date().toLocaleString('tr-TR') + ' itibarıyla güncellendi';
    }
    loadWeather().catch(() => { document.getElementById('updated').innerHTML = '<span class="error">Hava durumu verisi al&inodot;namad&inodot;.</span>'; });
  </script>
</body>
</html>
