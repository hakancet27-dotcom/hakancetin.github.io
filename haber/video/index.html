op:16px;z-index:4;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(22,22,22,.65);backdrop-filter:blur(8px);padding:7px 11px;font-size:12px;font-weight:700}.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;padding:10px 14px;border-radius:999px;z-index:12;display:none}.comment-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:7;opacity:0;transition:opacity .18s ease}.comment-backdrop.is-open{opacity:1}.comments{position:fixed;right:20px;bottom:20px;width:min(360px,92vw);max-height:70vh;background:#181818;border:1px solid #333;border-radius:18px;z-index:8;box-shadow:0 20px 60px #000;overflow:hidden;visibility:hidden;opacity:0;transform:translateY(14px);pointer-events:none;transition:transform .18s ease,opacity .18s ease,visibility .18s}.comments.is-open{visibility:visible;opacity:1;transform:none;pointer-events:auto}.comments header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #333;font-weight:700}.comments header button{background:#333;border:0;border-radius:999px;padding:6px 10px;cursor:pointer}.comment-list{max-height:42vh;overflow:auto;padding:12px 14px;display:grid;gap:8px}.comment{background:#252525;border-radius:12px;padding:8px 10px}.comment-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #333}.comment-form input{flex:1;min-width:0;background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:999px;padding:10px 13px;font-size:16px}.comment-form button{background:#e10600;border:0;border-radius:999px;padding:10px 12px;font-weight:700}.status{height:100dvh;display:grid;place-items:center;text-align:center;padding:20px}.status-card{max-width:370px;background:#181818;border:1px solid #333;border-radius:18px;padding:20px}.status-card p{color:#c0c0c0}.status-card a{display:inline-block;margin-top:12px;background:#e10600;padding:10px 14px;border-radius:999px;font-weight:700}
@media(max-width:760px){
  .top{display:none!important}
  .phone{width:100vw;height:100dvh;max-height:none;border-radius:0}
  .actions{right:max(9px,env(safe-area-inset-right));left:auto;top:auto;bottom:max(126px,calc(env(safe-area-inset-bottom) + 94px));transform:none;gap:10px}
  .act{width:42px;height:42px;font-size:0;background:rgba(17,17,17,.42);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .act svg{width:20px;height:20px}
  .actions small{display:none}

  .hint{display:none}
  .meta{left:0;right:58px;bottom:max(16px,calc(env(safe-area-inset-bottom) + 10px));transform:none;width:auto;padding:12px 14px}
  .meta b{font-size:.87rem}.meta h1{font-size:1rem;line-height:1.28;max-width:100%}.meta p{font-size:.79rem;opacity:.92}.btn{padding:8px 13px;font-size:.88rem}
  .badge{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));font-size:11px;padding:6px 10px}
  .comments{left:0;right:0;bottom:0;width:100%;max-height:min(74dvh,560px);border-radius:20px 20px 0 0;border:0;background:#151515;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom)}
  .comments.is-open{transform:translateY(0)}
  .comments header{position:relative;padding:22px 16px 12px;font-size:1.02rem}
  .comments header:before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:999px;background:#5d5d5d}
  .comments header button{background:transparent;color:#d0d5dd;padding:6px;font-size:.9rem}

<body>
<nav class="top"><a class="logo" href="/haber/" aria-label="Ana Sayfa">H</a><a href="/haber/">Ana Sayfa</a><a href="/haber/video/">Shorts</a><a href="https://www.youtube.com/@NartanesiHaber/shorts" target="_blank" rel="noopener">Kanal</a></nav>
<div class="badge" id="feed-badge"></div>
<main class="feed" id="feed"><div class="status"><div class="status-card"><strong>Shorts videoları yükleniyor…</strong></div></div></main>
<div class="hint"><span>↑</span><span>↓</span></div>
<div class="toast" id="toast"></div>
<div class="comment-backdrop" id="comment-backdrop" hidden></div>
<aside class="comments" id="comments" role="dialog" aria-modal="true" aria-label="Yorumlar" aria-hidden="true"><header><span>Yorumlar</span><button type="button" id="comment-close" aria-label="Yorumları kapat">Kapat</button></header><div class="comment-list" id="comment-list"></div><form class="comment-form" id="comment-form"><input id="comment-input" maxlength="240" placeholder="Yorum yaz" aria-label="Yorum yaz"><button type="submit">Gönder</button></form></aside>
<script>
(function(){
  'use strict';
  const feed=document.getElementById('feed');
  const badge=document.getElementById('feed-badge');
  const toast=document.getElementById('toast');
  const panel=document.getElementById('comments');
  const backdrop=document.getElementById('comment-backdrop');
  const list=document.getElementById('comment-list');
  const form=document.getElementById('comment-form');
  const input=document.getElementById('comment-input');
  let currentId='';
  let activeItem=null;
  let player=null;
  let pendingItem=null;
  let continuousPlayback=false;
  let switchingUntil=0;

  function key(id,type){return 'shorts:'+id+':'+type;}
  function text(parent,tag,value,className){const node=document.createElement(tag);if(className){node.className=className;}node.textContent=String(value||'');parent.appendChild(node);return node;}
  function notify(message){toast.textContent=message;toast.style.display='block';window.setTimeout(function(){toast.style.display='none';},1600);}
  function newsUrl(value){return typeof value==='string'&&/^\/haber(?:\/|\?|$)/.test(value)?value:'/haber/';}
  function storedComments(){try{return JSON.parse(localStorage.getItem(key(currentId,'comments'))||'[]');}catch(error){return [];}}
  function renderComments(){list.replaceChildren();const rows=storedComments();if(!rows.length){text(list,'div','İlk yorumu sen yaz.','comment');return;}rows.forEach(function(row){text(list,'div',row,'comment');});}
  function svg(path){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+path+'</svg>';}
  const icons={like:svg('<path d="M12 20.5S4 15.8 4 9.3A4.4 4.4 0 0 1 12 6.7 4.4 4.4 0 0 1 20 9.3c0 6.5-8 11.2-8 11.2Z"/>'),comment:svg('<path d="M4 5.5h16v11H9l-5 3v-14Z"/>'),share:svg('<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 13v7h14v-7"/>')};
  function action(label,icon,className){const button=document.createElement('button');button.type='button';button.className='act '+className;button.setAttribute('aria-label',label);button.innerHTML=icon;return button;}
  function openComments(videoId){currentId=videoId;renderComments();backdrop.hidden=false;requestAnimationFrame(function(){backdrop.classList.add('is-open');panel.classList.add('is-open');});panel.setAttribute('aria-hidden','false');document.body.classList.add('comments-open');input.focus();}
  function closeComments(){panel.classList.remove('is-open');backdrop.classList.remove('is-open');panel.setAttribute('aria-hidden','true');document.body.classList.remove('comments-open');window.setTimeout(function(){backdrop.hidden=true;},190);}
  function buildItem(video){
    const item=document.createElement('section');item.className='item';item.dataset.id=video.video_id;
    const phone=document.createElement('div');phone.className='phone';phone.style.backgroundImage='url(https://i.ytimg.com/vi/'+encodeURIComponent(video.video_id)+'/hqdefault.jpg)';const slot=document.createElement('div');slot.className='player-slot';phone.appendChild(slot);item.appendChild(phone);
    const actions=document.createElement('div');actions.className='actions';
    const likeBox=document.createElement('div');likeBox.className='action-wrap';const like=action('Beğen',icons.like,'like');const countNode=text(likeBox,'small','0','like-count');likeBox.prepend(like);actions.appendChild(likeBox);
    const commentBox=document.createElement('div');commentBox.className='action-wrap';commentBox.appendChild(action('Yorum yaz',icons.comment,'comment-open'));actions.appendChild(commentBox);
    const shareBox=document.createElement('div');shareBox.className='action-wrap';shareBox.appendChild(action('Paylaş',icons.share,'share'));actions.appendChild(shareBox);item.appendChild(actions);
    const meta=document.createElement('div');meta.className='meta';text(meta,'b','@NartanesiHaber');text(meta,'h1',video.title||'Nartanesi Haber Shorts');text(meta,'p',video.description||'Nartanesi Haber Shorts içeriği.');const read=document.createElement('a');read.className='btn';read.href=newsUrl(video.news_url);read.textContent='Haberi Oku';meta.appendChild(read);item.appendChild(meta);
    let count=Number(localStorage.getItem(key(video.video_id,'likes'))||0);if(localStorage.getItem(key(video.video_id,'liked'))==='1'){like.classList.add('active');}countNode.textContent=count?String(count):'';
    like.addEventListener('click',function(){const liked=localStorage.getItem(key(video.video_id,'liked'))==='1';count=Math.max(0,count+(liked?-1:1));if(liked){localStorage.removeItem(key(video.video_id,'liked'));like.classList.remove('active');}else{localStorage.setItem(key(video.video_id,'liked'),'1');like.classList.add('active');}localStorage.setItem(key(video.video_id,'likes'),String(count));countNode.textContent=count?String(count):'';});
    item.querySelector('.comment-open').addEventListener('click',function(){openComments(video.video_id);});
    item.querySelector('.share').addEventListener('click',async function(){const url=location.origin+location.pathname+'?v='+encodeURIComponent(video.video_id);try{if(navigator.share){await navigator.share({title:video.title||'Shorts',url:url});}else{await navigator.clipboard.writeText(url);notify('Link kopyalandı');}}catch(error){notify('Paylaşım iptal edildi');}});
    return item;
  }
  function onPlayerStateChange(event){
    if(!window.YT){return;}
    if(event.data===YT.PlayerState.PLAYING){
      continuousPlayback=true;
      switchingUntil=0;
      return;
    }
    if(event.data===YT.PlayerState.PAUSED&&Date.now()>switchingUntil){
      continuousPlayback=false;
      return;
    }
    if(event.data===YT.PlayerState.ENDED&&continuousPlayback&&activeItem){
      player.seekTo(0,true);
      player.playVideo();
    }
  }
  function attachPlayer(item){
    if(!item||item===activeItem){return;}
    if(!window.YT||!YT.Player){pendingItem=item;return;}
    const slot=item.querySelector('.player-slot');
    if(!player){
      const mount=document.createElement('div');slot.appendChild(mount);activeItem=item;
      player=new YT.Player(mount,{videoId:item.dataset.id,playerVars:{playsinline:1,rel:0,modestbranding:1,controls:1,autoplay:0},events:{onStateChange:onPlayerStateChange}});
      return;
    }
    const frame=player.getIframe();
    slot.replaceChildren(frame);
    activeItem=item;
    switchingUntil=Date.now()+1500;
    if(continuousPlayback){player.loadVideoById(item.dataset.id);player.playVideo();}
    else{player.cueVideoById(item.dataset.id);}
  }
  window.onYouTubeIframeAPIReady=function(){if(pendingItem){const item=pendingItem;pendingItem=null;attachPlayer(item);}};
  function showError(){feed.replaceChildren();const wrap=document.createElement('div');wrap.className='status';const card=document.createElement('div');card.className='status-card';text(card,'strong','Shorts akışı şu anda yüklenemedi.');text(card,'p','Videoları YouTube kanalımızdan izleyebilirsiniz.');const link=document.createElement('a');link.href='https://www.youtube.com/@NartanesiHaber/shorts';link.target='_blank';link.rel='noopener';link.textContent='YouTube Shorts';card.appendChild(link);wrap.appendChild(card);feed.appendChild(wrap);}
  async function loadFeed(){
    try{
      const response=await fetch('./shorts-feed.json',{cache:'no-store'});if(!response.ok){throw new Error('feed '+response.status);}
      const payload=await response.json();const seen=new Set();const videos=Array.isArray(payload.videos)?payload.videos.filter(function(video){if(!video||typeof video.video_id!=='string'||!/^[A-Za-z0-9_-]{11}$/.test(video.video_id)||seen.has(video.video_id)){return false;}seen.add(video.video_id);return true;}):[];
      if(!videos.length){throw new Error('empty feed');}
      const fragment=document.createDocumentFragment();videos.forEach(function(video){fragment.appendChild(buildItem(video));});feed.replaceChildren(fragment);badge.textContent=String(videos.length)+' Shorts';badge.style.display='block';
      const items=Array.from(document.querySelectorAll('.item'));const requested=new URL(location.href).searchParams.get('v');const initial=items.find(function(item){return item.dataset.id===requested;})||items[0];if(initial&&requested){initial.scrollIntoView({block:'start'});}attachPlayer(initial);
      const observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting&&entry.intersectionRatio>=0.65){attachPlayer(entry.target);const url=new URL(location.href);url.searchParams.set('v',entry.target.dataset.id);history.replaceState(null,'',url.pathname+url.search);}});},{threshold:[0.65]});items.forEach(function(item){observer.observe(item);});
    }catch(error){showError();}
  }
  document.getElementById('comment-close').addEventListener('click',closeComments);
  backdrop.addEventListener('click',closeComments);
  document.addEventListener('keydown',function(event){if(event.key==='Escape'&&panel.classList.contains('is-open')){closeComments();}});
  form.addEventListener('submit',function(event){event.preventDefault();const value=input.value.trim();if(!value||!currentId){return;}const rows=storedComments();rows.push(value);localStorage.setItem(key(currentId,'comments'),JSON.stringify(rows.slice(-50)));input.value='';renderComments();});
  loadFeed();
})();
</script>
</body>
