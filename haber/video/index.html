<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Nartanesi Haber YouTube Shorts videolarını dikey akışta izleyin.">
<link rel="canonical" href="https://hakancetin.com.tr/haber/video/">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}a{color:#fff;text-decoration:none}button{font:inherit;color:inherit}.top{position:fixed;left:0;top:0;bottom:0;width:92px;background:#0f0f0f;z-index:3;padding-top:18px;text-align:center}.top a{display:block;margin:0 0 28px;font-size:13px;font-weight:700}.top .logo{font-size:20px}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.item{height:100dvh;scroll-snap-align:start;display:grid;place-items:center;position:relative}.phone{height:calc(100dvh - 44px);max-height:820px;aspect-ratio:9/16;background:#111;border-radius:18px;overflow:hidden}.phone iframe{width:100%;height:100%;border:0}.actions{position:absolute;left:calc(50% + 250px);top:50%;transform:translateY(-38%);display:grid;gap:16px;text-align:center}.act{width:58px;height:58px;border:0;border-radius:50%;background:#272727;display:grid;place-items:center;font-size:22px;cursor:pointer}.act.active{background:#e10600}.actions small{display:block;margin-top:4px}.meta{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(420px,90vw);padding:12px;text-shadow:0 2px 10px #000}.meta b{display:block;margin-bottom:7px}.meta h1{font-size:1.06rem;line-height:1.35;margin:0 0 7px}.meta p{font-size:.86rem;margin:0}.btn{display:inline-block;margin-top:8px;background:#e10600;padding:8px 12px;border-radius:999px;font-weight:700}.hint{position:fixed;right:24px;top:50%;display:grid;gap:24px}.hint span{width:64px;height:64px;border-radius:50%;background:#272727;display:grid;place-items:center;font-size:30px}.badge{display:none;position:fixed;right:16px;top:16px;z-index:4;border:1px solid #333;border-radius:999px;background:#202020;padding:7px 11px;font-size:12px;font-weight:700}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;padding:10px 14px;border-radius:999px;z-index:9;display:none}.comments{position:fixed;right:20px;bottom:20px;width:min(360px,92vw);max-height:70vh;background:#181818;border:1px solid #333;border-radius:18px;z-index:8;display:none;box-shadow:0 20px 60px #000;overflow:hidden}.comments header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #333;font-weight:700}.comments button{background:#333;border:0;border-radius:999px;padding:6px 10px;cursor:pointer}.comment-list{max-height:42vh;overflow:auto;padding:12px 14px;display:grid;gap:8px}.comment{background:#252525;border-radius:12px;padding:8px 10px}.comment-form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #333}.comment-form input{flex:1;background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:999px;padding:10px}.comment-form button{background:#e10600;border:0;border-radius:999px;padding:10px 12px;font-weight:700}.status{height:100dvh;display:grid;place-items:center;text-align:center;padding:20px}.status-card{max-width:370px;background:#181818;border:1px solid #333;border-radius:18px;padding:20px}.status-card p{color:#c0c0c0}.status-card a{display:inline-block;margin-top:12px;background:#e10600;padding:10px 14px;border-radius:999px;font-weight:700}@media(max-width:760px){.top{left:0;right:0;bottom:auto;width:auto;height:48px;display:flex;gap:18px;align-items:center;padding:0 12px}.top a{margin:0}.phone{width:100vw;height:100dvh;border-radius:0}.actions{right:10px;left:auto;top:auto;bottom:118px;transform:none}.act{width:48px;height:48px;font-size:19px}.hint{display:none}.meta{left:0;right:64px;bottom:18px;transform:none;width:auto}.comments{left:8px;right:8px;bottom:8px;width:auto}.badge{top:58px}}
</style>
</head>
<body>
<nav class="top"><a class="logo" href="/haber/" aria-label="Ana Sayfa">H</a><a href="/haber/">Ana Sayfa</a><a href="/haber/video/">Shorts</a><a href="https://www.youtube.com/@NartanesiHaber/shorts" target="_blank" rel="noopener">Kanal</a></nav>
<div class="badge" id="feed-badge"></div>
<main class="feed" id="feed"><div class="status"><div class="status-card"><strong>Shorts videoları yükleniyor…</strong></div></div></main>
<div class="hint"><span>↑</span><span>↓</span></div>
<div class="toast" id="toast"></div>
<aside class="comments" id="comments"><header><span>Yorumlar</span><button type="button" id="comment-close">Kapat</button></header><div class="comment-list" id="comment-list"></div><form class="comment-form" id="comment-form"><input id="comment-input" maxlength="240" placeholder="Yorum yaz"><button type="submit">Gönder</button></form></aside>
<script>
(function(){
  'use strict';
  const feed=document.getElementById('feed');
  const badge=document.getElementById('feed-badge');
  const toast=document.getElementById('toast');
  const panel=document.getElementById('comments');
  const list=document.getElementById('comment-list');
  const form=document.getElementById('comment-form');
  const input=document.getElementById('comment-input');
  let currentId='';
  function key(id,type){return 'shorts:'+id+':'+type;}
  function text(parent,tag,value,className){const node=document.createElement(tag);if(className){node.className=className;}node.textContent=String(value||'');parent.appendChild(node);return node;}
  function notify(message){toast.textContent=message;toast.style.display='block';window.setTimeout(function(){toast.style.display='none';},1600);}
  function newsUrl(value){return typeof value==='string'&&/^\/haber(?:\/|\?|$)/.test(value)?value:'/haber/';}
  function embedUrl(id){return 'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?rel=0&modestbranding=1&playsinline=1';}
  function storedComments(){try{return JSON.parse(localStorage.getItem(key(currentId,'comments'))||'[]');}catch(error){return [];}}
  function renderComments(){list.replaceChildren();const rows=storedComments();if(!rows.length){text(list,'div','İlk yorumu sen yaz.','comment');return;}rows.forEach(function(row){text(list,'div',row,'comment');});}
  function action(label,symbol,className){const button=document.createElement('button');button.type='button';button.className='act '+className;button.setAttribute('aria-label',label);button.textContent=symbol;return button;}
  function buildItem(video){
    const item=document.createElement('section');item.className='item';item.dataset.id=video.video_id;
    const phone=document.createElement('div');phone.className='phone';const frame=document.createElement('iframe');frame.dataset.src=embedUrl(video.video_id);frame.title=video.title||'Nartanesi Haber Shorts';frame.loading='lazy';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;phone.appendChild(frame);item.appendChild(phone);
    const actions=document.createElement('div');actions.className='actions';
    const likeBox=document.createElement('div');const like=action('Beğen','♥','like');const small=document.createElement('small');const countNode=text(small,'span','0','like-count');likeBox.append(like,small);actions.appendChild(likeBox);
    const commentBox=document.createElement('div');commentBox.appendChild(action('Yorum yaz','💬','comment-open'));text(commentBox,'small','Yorum');actions.appendChild(commentBox);
    const shareBox=document.createElement('div');shareBox.appendChild(action('Paylaş','↗','share'));text(shareBox,'small','Paylaş');actions.appendChild(shareBox);item.appendChild(actions);
    const meta=document.createElement('div');meta.className='meta';text(meta,'b','@NartanesiHaber');text(meta,'h1',video.title||'Nartanesi Haber Shorts');text(meta,'p',video.description||'Nartanesi Haber Shorts içeriği.');const read=document.createElement('a');read.className='btn';read.href=newsUrl(video.news_url);read.textContent='Haberi Oku';meta.appendChild(read);item.appendChild(meta);
    let count=Number(localStorage.getItem(key(video.video_id,'likes'))||0);if(localStorage.getItem(key(video.video_id,'liked'))==='1'){like.classList.add('active');}countNode.textContent=String(count);
    like.addEventListener('click',function(){const liked=localStorage.getItem(key(video.video_id,'liked'))==='1';count=Math.max(0,count+(liked?-1:1));if(liked){localStorage.removeItem(key(video.video_id,'liked'));like.classList.remove('active');}else{localStorage.setItem(key(video.video_id,'liked'),'1');like.classList.add('active');}localStorage.setItem(key(video.video_id,'likes'),String(count));countNode.textContent=String(count);});
    item.querySelector('.comment-open').addEventListener('click',function(){currentId=video.video_id;panel.style.display='block';renderComments();input.focus();});
    item.querySelector('.share').addEventListener('click',async function(){const url=location.origin+location.pathname+'?v='+encodeURIComponent(video.video_id);try{if(navigator.share){await navigator.share({title:video.title||'Shorts',url:url});}else{await navigator.clipboard.writeText(url);notify('Link kopyalandı');}}catch(error){notify('Paylaşım iptal edildi');}});
    return item;
  }
  function activate(item){document.querySelectorAll('.item iframe').forEach(function(frame){if(frame.closest('.item')===item){if(!frame.src){frame.src=frame.dataset.src;}}else if(frame.src){frame.removeAttribute('src');}});}
  function showError(){feed.replaceChildren();const wrap=document.createElement('div');wrap.className='status';const card=document.createElement('div');card.className='status-card';text(card,'strong','Shorts akışı şu anda yüklenemedi.');text(card,'p','Videoları YouTube kanalımızdan izleyebilirsiniz.');const link=document.createElement('a');link.href='https://www.youtube.com/@NartanesiHaber/shorts';link.target='_blank';link.rel='noopener';link.textContent='YouTube Shorts';card.appendChild(link);wrap.appendChild(card);feed.appendChild(wrap);}
  async function loadFeed(){
    try{
      const response=await fetch('./shorts-feed.json',{cache:'no-store'});if(!response.ok){throw new Error('feed '+response.status);}
      const payload=await response.json();const seen=new Set();const videos=Array.isArray(payload.videos)?payload.videos.filter(function(video){if(!video||typeof video.video_id!=='string'||!/^[A-Za-z0-9_-]{11}$/.test(video.video_id)||seen.has(video.video_id)){return false;}seen.add(video.video_id);return true;}):[];
      if(!videos.length){throw new Error('empty feed');}
      const fragment=document.createDocumentFragment();videos.forEach(function(video){fragment.appendChild(buildItem(video));});feed.replaceChildren(fragment);badge.textContent=String(videos.length)+' Shorts';badge.style.display='block';
      const items=Array.from(document.querySelectorAll('.item'));const requested=new URL(location.href).searchParams.get('v');const initial=items.find(function(item){return item.dataset.id===requested;})||items[0];if(initial&&requested){initial.scrollIntoView({block:'start'});}activate(initial);
      const observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting&&entry.intersectionRatio>=0.65){activate(entry.target);const url=new URL(location.href);url.searchParams.set('v',entry.target.dataset.id);history.replaceState(null,'',url.pathname+url.search);}});},{threshold:[0.65]});items.forEach(function(item){observer.observe(item);});
    }catch(error){showError();}
  }
  document.getElementById('comment-close').addEventListener('click',function(){panel.style.display='none';});
  form.addEventListener('submit',function(event){event.preventDefault();const value=input.value.trim();if(!value||!currentId){return;}const rows=storedComments();rows.push(value);localStorage.setItem(key(currentId,'comments'),JSON.stringify(rows.slice(-50)));input.value='';renderComments();});
  loadFeed();
})();
</script>
</body>
</html>
