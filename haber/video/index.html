const toast=document.getElementById('toast');const panel=document.getElementById('comments');const list=document.getElementById('comment-list');const form=document.getElementById('comment-form');const input=document.getElementById('comment-input');let currentId='';function key(id,t){return 'shorts:'+id+':'+t}function showToast(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1600)}function renderComments(){const rows=JSON.parse(localStorage.getItem(key(currentId,'comments'))||'[]');list.innerHTML=rows.length?rows.map(x=>'<div class="comment">'+escapeHtml(x)+'</div>').join(''):'<div class="comment">İlk yorumu sen yaz.</div>'}function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function activateVideo(item){document.querySelectorAll('.item').forEach(other=>{const frame=other.querySelector('iframe');if(!frame)return;if(other===item){if(!frame.src){frame.src=frame.dataset.src}}else{if(frame.src){frame.src=''}}})}document.querySelectorAll('.item').forEach(item=>{const id=item.dataset.id;const liked=localStorage.getItem(key(id,'liked'))==='1';const count=Number(localStorage.getItem(key(id,'likes'))||0);const like=item.querySelector('.like');const lc=item.querySelector('.like-count');if(liked)like.classList.add('active');lc.textContent=count;like.addEventListener('click',()=>{let c=Number(localStorage.getItem(key(id,'likes'))||0);const is=localStorage.getItem(key(id,'liked'))==='1';if(is){c=Math.max(0,c-1);localStorage.removeItem(key(id,'liked'));like.classList.remove('active')}else{c++;localStorage.setItem(key(id,'liked'),'1');like.classList.add('active')}localStorage.setItem(key(id,'likes'),String(c));lc.textContent=c});item.querySelector('.comment-open').addEventListener('click',()=>{currentId=id;panel.style.display='block';renderComments();input.focus()});item.querySelector('.share').addEventListener('click',async()=>{const url=location.origin+location.pathname+'?v='+encodeURIComponent(id);try{if(navigator.share){await navigator.share({title:'Shorts',url})}else{await navigator.clipboard.writeText(url);showToast('Link kopyalandı')}}catch(e){showToast('Paylaşım iptal edildi')}})});const items=[...document.querySelectorAll('.item')];const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting&&entry.intersectionRatio>=0.65){activateVideo(entry.target);const id=entry.target.dataset.id;const url=new URL(location.href);url.searchParams.set('v',id);history.replaceState(null,'',url.pathname+url.search)}})},{threshold:[0.65]});items.forEach(item=>observer.observe(item));activateVideo(items[0]);document.getElementById('comment-close').onclick=()=>panel.style.display='none';form.addEventListener('submit',e=>{e.preventDefault();const v=input.value.trim();if(!v||!currentId)return;const rows=JSON.parse(localStorage.getItem(key(currentId,'comments'))||'[]');rows.push(v);localStorage.setItem(key(currentId,'comments'),JSON.stringify(rows.slice(-50)));input.value='';renderComments()});
