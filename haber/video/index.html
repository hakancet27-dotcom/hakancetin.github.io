<script>
(function(){
'use strict';
const feed=document.getElementById('feed'), badge=document.getElementById('badge'), toast=document.getElementById('toast');
const drawer=document.getElementById('comments'), shade=document.getElementById('shade'), list=document.getElementById('list'), form=document.getElementById('form'), input=document.getElementById('input');
const players=new Map(), desired=new Set(); let active=null, apiReady=false, keepPlaying=false, switching=false, currentId='';
function k(id,t){return 'shorts:'+id+':'+t;} function esc(v){return String(v||'');}
function notify(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1500);}
function icon(p){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';}
const icons={heart:icon('<path d="M12 20.5S4 15.8 4 9.3A4.4 4.4 0 0 1 12 6.7 4.4 4.4 0 0 1 20 9.3c0 6.5-8 11.2-8 11.2Z"/>'),chat:icon('<path d="M4 5.5h16v11H9l-5 3v-14Z"/>'),share:icon('<path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 13v7h14v-7"/>')};
function playerFor(item, play){
 if(!item)return null; if(players.has(item)){if(play){players.get(item).playVideo();}return players.get(item);}
 if(!apiReady){if(play)desired.add(item);return null;}
 const mount=document.createElement('div'); item.querySelector('.player').appendChild(mount);
 const p=new YT.Player(mount,{videoId:item.dataset.id,playerVars:{playsinline:1,rel:0,modestbranding:1,controls:0,autoplay:0},events:{onReady:e=>{if(desired.has(item)||(play&&item===active)){desired.delete(item);e.target.playVideo();}},onStateChange:e=>state(item,e)}});

}
function prime(item){if(!item)return; [item.previousElementSibling,item,item.nextElementSibling].forEach(x=>{if(x&&x.classList.contains('item'))playerFor(x,false);});}
function state(item,e){if(!window.YT)return; if(e.data===YT.PlayerState.PLAYING){if(item===active){keepPlaying=true;item.classList.add('playing');prime(item);}return;} if(e.data===YT.PlayerState.PAUSED){item.classList.remove('playing');if(item===active&&!switching)keepPlaying=false;return;} if(e.data===YT.PlayerState.ENDED&&item===active&&keepPlaying){e.target.seekTo(0,true);e.target.playVideo();}}
function select(item, userSwipe){if(!item)return; const before=active; active=item; switching=true; if(before&&before!==item){before.classList.remove('playing');const old=players.get(before);if(old)old.pauseVideo();} prime(item); if(keepPlaying){desired.add(item);const p=playerFor(item,true);if(p&&userSwipe)p.playVideo();} setTimeout(()=>switching=false,500);}
function toggle(item){select(item,false); const p=playerFor(item,true); if(!p){keepPlaying=true;desired.add(item);return;} let s=-1;try{s=p.getPlayerState();}catch(e){} if(window.YT&&s===YT.PlayerState.PLAYING){keepPlaying=false;p.pauseVideo();item.classList.remove('playing');}else{keepPlaying=true;desired.add(item);p.playVideo();}}
function swipeSurface(surface,item){let y=null,moved=false;surface.addEventListener('touchstart',e=>{if(e.changedTouches.length){y=e.changedTouches[0].clientY;moved=false;}},{passive:true});surface.addEventListener('touchend',e=>{if(y===null||!e.changedTouches.length)return;const d=e.changedTouches[0].clientY-y;y=null;if(Math.abs(d)>42){moved=true;const target=d<0?item.nextElementSibling:item.previousElementSibling;if(target&&target.classList.contains('item')){select(target,true);target.scrollIntoView({block:'start',behavior:'smooth'});}}},{passive:true});surface.addEventListener('click',e=>{if(moved){moved=false;e.preventDefault();return;}toggle(item);});}
function commentRows(){let rows=[];try{rows=JSON.parse(localStorage.getItem(k(currentId,'comments'))||'[]');}catch(e){}list.replaceChildren();(rows.length?rows:['İlk yorumu sen yaz.']).forEach(t=>{const d=document.createElement('div');d.className='comment';d.textContent=t;list.appendChild(d);});}
function openComments(id){currentId=id;commentRows();shade.hidden=false;requestAnimationFrame(()=>{shade.classList.add('open');drawer.classList.add('open');});drawer.setAttribute('aria-hidden','false');document.body.classList.add('comments-open');input.focus();}
function closeComments(){shade.classList.remove('open');drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');document.body.classList.remove('comments-open');setTimeout(()=>shade.hidden=true,190);}
function tool(label,cl,svg){const b=document.createElement('button');b.type='button';b.className='tool '+cl;b.setAttribute('aria-label',label);b.innerHTML=svg;return b;}
function card(v){const item=document.createElement('section');item.className='item';item.dataset.id=v.video_id;const phone=document.createElement('div');phone.className='phone';phone.style.backgroundImage='url(https://i.ytimg.com/vi/'+encodeURIComponent(v.video_id)+'/hqdefault.jpg)';const mount=document.createElement('div');mount.className='player';phone.appendChild(mount);const touch=document.createElement('button');touch.className='touch';touch.type='button';touch.innerHTML='<span class="play" aria-hidden="true"></span>';swipeSurface(touch,item);phone.appendChild(touch);item.appendChild(phone);const tools=document.createElement('div');tools.className='tools';const likeBox=document.createElement('div');likeBox.className='toolbox';const like=tool('Beğen','like',icons.heart);const count=document.createElement('small');count.className='count';let n=Number(localStorage.getItem(k(v.video_id,'likes'))||0);count.textContent=n?String(n):'';like.classList.toggle('active',localStorage.getItem(k(v.video_id,'liked'))==='1');like.onclick=()=>{const on=localStorage.getItem(k(v.video_id,'liked'))==='1';n=Math.max(0,n+(on?-1:1));if(on){localStorage.removeItem(k(v.video_id,'liked'));}else{localStorage.setItem(k(v.video_id,'liked'),'1');}localStorage.setItem(k(v.video_id,'likes'),String(n));like.classList.toggle('active',!on);count.textContent=n?String(n):'';};likeBox.append(like,count);tools.append(likeBox);const com=tool('Yorum yaz','',icons.chat);com.onclick=()=>openComments(v.video_id);tools.append(com);const share=tool('Paylaş','',icons.share);share.onclick=async()=>{const u=location.origin+location.pathname+'?v='+encodeURIComponent(v.video_id);try{if(navigator.share)await navigator.share({title:v.title||'Shorts',url:u});else{await navigator.clipboard.writeText(u);notify('Link kopyalandı');}}catch(e){}};tools.append(share);item.appendChild(tools);const cap=document.createElement('div');cap.className='caption';cap.innerHTML='<b>@NartanesiHaber</b><h1></h1><p></p><a class="read">Haberi Oku</a>';cap.querySelector('h1').textContent=esc(v.title||'Nartanesi Haber Shorts');cap.querySelector('p').textContent=esc(v.description||'Nartanesi Haber Shorts içeriği.');cap.querySelector('a').href=typeof v.news_url==='string'&&/^\/haber(?:\/|\?|$)/.test(v.news_url)?v.news_url:'/haber/';item.appendChild(cap);return item;}
async function load(){try{const r=await fetch('./shorts-feed.json',{cache:'no-store'});const data=await r.json();const seen=new Set();const videos=(data.videos||[]).filter(v=>v&&/^[A-Za-z0-9_-]{11}$/.test(v.video_id)&&!seen.has(v.video_id)&&(seen.add(v.video_id)||true));if(!videos.length)throw Error();const frag=document.createDocumentFragment();videos.forEach(v=>frag.appendChild(card(v)));feed.replaceChildren(frag);badge.textContent=videos.length+' Shorts';badge.style.display='block';const items=[...feed.querySelectorAll('.item')];active=items[0];prime(active);const q=new URL(location.href).searchParams.get('v');const requested=items.find(i=>i.dataset.id===q);if(requested){active=requested;requested.scrollIntoView({block:'start'});prime(active);}new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.65){select(e.target,false);}}),{threshold:[.65]}).observe(items[0]);items.forEach((i,n)=>{if(n)new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.65)select(e.target,false);}),{threshold:[.65]}).observe(i);});}catch(e){feed.innerHTML='<div class="status"><div>Shorts akışı şu anda yüklenemedi.<br><a href="https://www.youtube.com/@NartanesiHaber/shorts">YouTube Shorts</a></div></div>';}}
window.onYouTubeIframeAPIReady=()=>{apiReady=true;if(active)prime(active);desired.forEach(i=>playerFor(i,true));};document.getElementById('close').onclick=closeComments;shade.onclick=closeComments;form.onsubmit=e=>{e.preventDefault();const v=input.value.trim();if(!v||!currentId)return;let a=[];try{a=JSON.parse(localStorage.getItem(k(currentId,'comments'))||'[]');}catch(err){}a.push(v);localStorage.setItem(k(currentId,'comments'),JSON.stringify(a.slice(-50)));input.value='';commentRows();};load();
})();
