# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: hakancet27-dotcom/hakancetin.github.io
  branch: main

media_folder: articles/images
public_folder: /articles/images
publish_mode: simple
site_url: https://hakancetin.com.tr
display_url: https://hakancetin.com.tr
locale: tr

# HABER NEWSROOM CMS
# - CMS JSON kaynaklarini ve haber operasyon taleplerini düzenler.
# - HTML sayfalar, optimize görseller ve indeks workflow tarafindan üretilir.
# - Yayin üreten workflow talepleri açik onay olmadan calistirilmaz.
collections:
  - name: newsroom_create_article
    label: "0.1 - Yeni Haber Yaz"
    label_singular: "Yeni Haber Taslağı"
    folder: newsroom/drafts
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{workflow_status}} | {{category}} | {{title}}"
    fields:
      - label: İşlem Durumu
        name: workflow_status
        widget: select
        default: draft
        options:
          - { label: Taslak, value: draft }
          - { label: AI ile Geliştir, value: ai_enhance_requested }
          - { label: İncelemeye Gönder, value: submit_for_review }
          - { label: Kalite Geçerse Yayın Talebi, value: publish_requested }
          - { label: İşlendi, value: processed }
      - { label: Başlık, name: title, widget: string }
      - { label: Spot, name: spot, widget: text, required: false }
      - label: Kategori
        name: category
        widget: select
        default: Gündem
        options: [Son Dakika, Gündem, Siyaset, Ekonomi, Dünya, Spor, Magazin, Teknoloji, Sağlık, Video]
      - { label: Yayın Tarihi, name: date, widget: string, required: false, hint: "Örnek: 23.05.2026" }
      - { label: Kaynak Linkleri, name: source_urls, widget: list, required: false, field: { label: URL, widget: string } }
      - { label: Kaynak / Editör Notu, name: source_note, widget: text, required: false }
      - { label: Haber Gövdesi HTML, name: content_html, widget: text, required: false }
      - { label: Ana Görsel, name: uploaded_image, widget: image, required: false }
      - { label: Görsel Alt Metni, name: image_alt, widget: string, required: false }
      - { label: Meta Title, name: meta_title, widget: string, required: false }
      - { label: Meta Description, name: meta_description, widget: text, required: false }
      - { label: Etiketler, name: tags, widget: list, required: false, field: { label: Etiket, widget: string } }
      - { label: Öne Çıkar, name: featured, widget: boolean, required: false, default: false }
      - { label: AI Talimatı, name: editor_ai_instruction, widget: text, required: false }
      - { label: İşlem Sonucu, name: processor_result, widget: text, required: false, readonly: true }

  - name: newsroom_ai_requests
    label: "0.2 - AI Haber Üretimi"
    label_singular: "AI Haber Talebi"
    folder: newsroom/requests/ai-article
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: topic
    summary: "{{request_status}} | {{mode}} | {{topic}}"
    fields:
      - label: Talep Durumu
        name: request_status
        widget: select
        default: queued
        options:
          - { label: Kuyruğa Ekle, value: queued }
          - { label: İşleniyor, value: running }
          - { label: Tamamlandı, value: completed }
          - { label: Dikkat Gerekiyor, value: needs_attention }
          - { label: Beklet, value: hold }
          - { label: İptal Et, value: cancelled }
      - { label: Haber Konusu / Input, name: topic, widget: string }
      - label: Üretim Modu
        name: mode
        widget: select
        default: full_seo_article
        options:
          - { label: SEO Uzun Haber, value: full_seo_article }
          - { label: Hızlı Kısa Haber, value: short_breaking }
          - { label: Kaynaklardan Haber Yaz, value: source_based }
          - { label: Mevcut Metni Geliştir, value: rewrite }
          - { label: Discover Odaklı Haber, value: discover }
      - label: Kategori
        name: category
        widget: select
        default: auto
        options:
          - { label: AI Seçsin, value: auto }
          - { label: Son Dakika, value: son-dakika }
          - { label: Gündem, value: gundem }
          - { label: Siyaset, value: siyaset }
          - { label: Ekonomi, value: ekonomi }
          - { label: Dünya, value: dunya }
          - { label: Spor, value: spor }
          - { label: Magazin, value: magazin }
          - { label: Teknoloji, value: teknoloji }
          - { label: Sağlık, value: saglik }
      - { label: Kaynak URL'leri, name: source_urls, widget: list, required: false, field: { label: URL, widget: string } }
      - { label: Ham Bilgi / Notlar, name: raw_notes, widget: text, required: false }
      - label: Yayın Tercihi
        name: output_action
        widget: select
        default: review
        options:
          - { label: Önce İncelemeye Gönder, value: review }
          - { label: Kalite Geçerse Yayınla, value: publish_if_quality_pass }
          - { label: Sadece Taslak Üret, value: draft_only }
      - { label: Görsel Otomatik Bul / Üret, name: create_image, widget: boolean, default: true }
      - { label: Görsel Prompt Yönlendirmesi, name: image_instruction, widget: text, required: false }
      - { label: Dil, name: language, widget: select, default: Turkish, options: [Turkish, English, German] }
      - { label: Çıktı Slug, name: output_slug, widget: string, required: false, readonly: true }
      - { label: Çıktı Yolu, name: output_path, widget: string, required: false, readonly: true }
      - { label: Quality Score, name: quality_score, widget: number, required: false, readonly: true }
      - { label: Quality Status, name: quality_status, widget: string, required: false, readonly: true }
      - { label: İşlem Mesajı, name: processor_message, widget: text, required: false, readonly: true }

  - name: newsroom_trend_radar
    label: "0.3 - Google Trend Radar"
    label_singular: "Trend Takip Kaydı"
    folder: newsroom/trends
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: query
    summary: "{{status}} | {{region}} | {{query}}"
    fields:
      - label: Takip Durumu
        name: status
        widget: select
        default: watching
        options:
          - { label: Takip Et, value: watching }
          - { label: Haber Önerisi İste, value: suggest_articles }
          - { label: Bu Trendden Haber Talebi Oluştur, value: generate_article }
          - { label: Kontrol Edildi, value: checked }
          - { label: Haber Talebi Oluşturuldu, value: article_request_created }
          - { label: Arşivle, value: archived }
      - { label: Aranacak Konu / Anahtar Kelime, name: query, widget: string }
      - label: Bölge
        name: region
        widget: select
        default: TR
        options:
          - { label: Türkiye, value: TR }
          - { label: Amerika, value: US }
          - { label: Almanya, value: DE }
          - { label: Dünya, value: WORLD }
      - label: Zaman Aralığı
        name: timeframe
        widget: select
        default: now_24h
        options:
          - { label: Son 1 Saat, value: now_1h }
          - { label: Son 4 Saat, value: now_4h }
          - { label: Son 24 Saat, value: now_24h }
          - { label: Son 7 Gün, value: now_7d }
      - { label: Hedef Kategori, name: category, widget: select, default: auto, options: [auto, gundem, siyaset, ekonomi, dunya, spor, magazin, teknoloji, saglik] }
      - { label: Editoryel Not, name: editor_note, widget: text, required: false }
      - { label: Trend Skoru, name: trend_score, widget: number, required: false, readonly: true }
      - { label: Önerilen Başlıklar, name: suggested_titles, widget: list, required: false, field: { label: Başlık, widget: string } }
      - { label: Son Kontrol, name: checked_at, widget: string, required: false, readonly: true }

  - name: newsroom_workflow_requests
    label: "0.4 - Inputlu Workflow"
    label_singular: "Workflow Talebi"
    folder: newsroom/requests/workflow
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: request_name
    summary: "{{status}} | {{run_mode}} | {{request_name}}"
    fields:
      - label: Onay ve Çalıştırma Durumu
        name: status
        widget: select
        default: queued
        options:
          - { label: Talebi Kaydet, value: queued }
          - { label: Onay Bekliyor, value: approval_required }
          - { label: Onayla ve Çalıştır, value: approved_to_run }
          - { label: Çalışıyor, value: running }
          - { label: Tamamlandı, value: completed }
          - { label: Hata, value: failed }
          - { label: Beklet, value: hold }
          - { label: İptal Et, value: cancelled }
      - { label: Talep Adı, name: request_name, widget: string }
      - label: Çalışma Modu
        name: run_mode
        widget: select
        default: reindex_only
        options:
          - { label: Yalnız Yeniden İndeksle, value: reindex_only }
          - { label: Sadece Haber Sitesi Üretimi, value: website_only }
          - { label: Tüm Pipeline, value: all }
      - { label: Konu Filtresi, name: selected_topic, widget: select, default: all, options: [all, gundem, siyaset, ekonomi, dunya, spor, magazin, teknoloji, saglik] }
      - { label: Geriye Dönük Saat, name: hours_back, widget: number, default: 24, value_type: int, min: 1, max: 168 }
      - { label: YouTube Yüklemeyi Atla, name: skip_youtube_upload, widget: boolean, default: true }
      - { label: Thumbnail Only, name: thumbnail_only, widget: boolean, default: false }
      - { label: Ek Input / Editoryel Talimat, name: input_prompt, widget: text, required: false }
      - { label: Çalıştırma Sonucu, name: execution_result, widget: text, required: false, readonly: true }
      - { label: Workflow Run Linki, name: workflow_url, widget: string, required: false, readonly: true }
      - { label: İşlenme Zamanı, name: processed_at, widget: string, required: false, readonly: true }

  - name: newsroom_bulk_actions
    label: "0.5 - Toplu İşlemler"
    label_singular: "Toplu İşlem Talebi"
    folder: newsroom/requests/bulk
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: action_name
    summary: "{{status}} | {{operation}} | {{action_name}}"
    fields:
      - { label: İşlem Adı, name: action_name, widget: string }
      - { label: Durum, name: status, widget: select, default: queued, options: [queued, completed, failed, hold, cancelled] }
      - label: Toplu İşlem
        name: operation
        widget: select
        options:
          - { label: Kategori Değiştir, value: change_category }
          - { label: Yeniden Kalite Kontrolü, value: quality_recheck }
          - { label: Yeniden SEO Optimize Et, value: seo_rebuild }
          - { label: İndeksten Kaldır, value: noindex }
          - { label: Yeniden İndekse Al, value: reindex }
          - { label: Görselleri Optimize Et, value: optimize_images }
          - { label: Featured Ata, value: set_featured }
      - { label: Hedef Haber Slugları, name: slugs, widget: list, field: { label: Slug, widget: string } }
      - { label: Yeni Kategori, name: category, widget: select, required: false, options: [Gündem, Siyaset, Ekonomi, Dünya, Spor, Magazin, Teknoloji, Sağlık] }
      - { label: Not, name: note, widget: text, required: false }
      - { label: Sonuç, name: result, widget: text, required: false, readonly: true }

  - name: newsroom_image_jobs
    label: "0.6 - Görsel İşleme"
    label_singular: "Görsel Optimizasyon Talebi"
    folder: newsroom/requests/images
    create: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: job_name
    summary: "{{status}} | {{preset}} | {{job_name}}"
    fields:
      - { label: İşlem Adı, name: job_name, widget: string }
      - { label: Durum, name: status, widget: select, default: queued, options: [queued, completed, failed, hold, cancelled] }
      - { label: Kaynak Görsel, name: source_image, widget: image }
      - label: Çıktı Preseti
        name: preset
        widget: select
        default: article_hero
        options:
          - { label: Haber Hero 1200x675, value: article_hero }
          - { label: Discover 1200x675, value: discover }
          - { label: Sosyal Paylaşım 1200x630, value: social_share }
          - { label: Thumbnail 640x360, value: thumbnail }
      - { label: WebP Dönüştür, name: convert_webp, widget: boolean, default: true }
      - { label: EXIF Temizle, name: strip_exif, widget: boolean, default: true }
      - { label: Kalite, name: quality, widget: number, value_type: int, default: 78, min: 40, max: 95 }
      - { label: Alt Metin, name: image_alt, widget: string, required: false }
      - { label: Çıktı Dosyaları, name: outputs, widget: list, required: false, readonly: true, field: { label: URL, widget: string } }
      - { label: İşlem Sonucu, name: result, widget: text, required: false, readonly: true }

  - name: newsroom_status
    label: "0.7 - Sistem Durumu"
    files:
      - label: "Son Newsroom Çalışması"
        name: last_run
        file: newsroom/status/last-run.json
        fields:
          - { label: İşlenme Zamanı, name: processed_at, widget: string, required: false, readonly: true }
          - { label: İşlem Sonuçları, name: results, widget: object, required: false, readonly: true, fields: [{ label: Trend, name: trends, widget: number, required: false }, { label: Görsel, name: images, widget: number, required: false }, { label: Taslak, name: drafts, widget: number, required: false }, { label: AI Talebi, name: ai_requests, widget: number, required: false }, { label: Toplu İşlem, name: bulk_actions, widget: number, required: false }] }

  - name: review_pending
    label: "1 - Bekleyen İncelemeler"
    label_singular: "Bekleyen Haber"
    folder: review/pending
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{review_status}} | {{quality_score}} | {{date}} - {{title}}"
    fields: &base_fields
      - label: İnceleme Durumu
        name: review_status
        widget: select
        required: false
        default: pending
        options:
          - { label: Beklemede, value: pending }
          - { label: Onaylandı ve Yayınlanacak, value: approved }
          - { label: Reddedildi, value: rejected }
      - { label: Başlık, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, readonly: true }
      - { label: Tarih, name: date, widget: string }
      - { label: Dil, name: language, widget: string, required: false, readonly: true }
      - { label: Ülke, name: country, widget: string, required: false, readonly: true }
      - { label: Kategori, name: category, widget: select, required: false, options: [Son Dakika, Gündem, Siyaset, Ekonomi, Dünya, Spor, Magazin, Teknoloji, Sağlık, Video] }
      - { label: Spot, name: spot, widget: text, required: false }
      - { label: Özet, name: summary, widget: text, required: false }
      - { label: Haber Gövdesi HTML, name: content_html, widget: text, required: false }
      - { label: Görsel URL, name: image_url, widget: string, required: false }
      - { label: Görsel Alt Metni, name: image_alt, widget: string, required: false }
      - { label: Görsel Promptu, name: image_prompt, widget: text, required: false }
      - { label: Meta Title, name: meta_title, widget: string, required: false }
      - { label: Meta Description, name: meta_description, widget: text, required: false }
      - { label: Discover Başlıkları, name: discover_titles, widget: list, required: false, field: { label: Başlık, widget: string } }
      - { label: Etiketler, name: tags, widget: list, required: false, field: { label: Etiket, widget: string } }
      - { label: Görsel Anahtar Kelimeleri, name: visual_keywords, widget: list, required: false, field: { label: Kelime, widget: string } }
      - { label: URL Prefix, name: url_prefix, widget: string, required: false, readonly: true }
      - { label: Word Count, name: word_count, widget: number, required: false, readonly: true }
      - { label: Quality Score, name: quality_score, widget: number, required: false, readonly: true }
      - { label: Quality Status, name: quality_status, widget: string, required: false, readonly: true }
      - { label: Review Required, name: review_required, widget: boolean, required: false, readonly: true }
      - { label: Indexed On Home, name: indexed_on_home, widget: boolean, required: false, readonly: true }

  - name: published_tr
    label: "2.1 - Yayındaki Haberler / Türkçe"
    label_singular: "Yayındaki Türkçe Haber"
    folder: articles
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{date}} - {{title}}"
    fields: *base_fields

  - name: published_en
    label: "2.2 - Published News / English"
    label_singular: "Published English News"
    folder: news/articles
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{date}} - {{title}}"
    fields: *base_fields

  - name: published_de
    label: "2.3 - Veröffentlichte Nachrichten / Deutsch"
    label_singular: "Veröffentlichte Nachricht"
    folder: nachrichten/artikel
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{date}} - {{title}}"
    fields: *base_fields
