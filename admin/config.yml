# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: hakancet27-dotcom/hakancetin.github.io
  branch: main

media_folder: articles/images
public_folder: /articles/images
publish_mode: simple
site_url: https://hakancetin.com.tr
display_url: https://hakancetin.com.tr
locale: tr

# Not:
# - CMS sadece JSON kaynaklarını düzenler.
# - HTML sayfalar workflow tarafından yeniden üretilir.
# - CMS değişikliklerini sitede görmek için website_only workflow çalıştırılmalıdır.
# - Bazı eski JSON dosyalarında content_html alanı olmayabilir; bu durumda gövde alanı boş görünür.
collections:
  - name: review_pending
    label: "1 - Bekleyen İncelemeler"
    label_singular: "Bekleyen Haber"
    folder: review/pending
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{review_status}} | {{quality_score}} | {{date}} - {{title}}"
    fields: &base_fields
      - label: İnceleme Durumu
        name: review_status
        widget: select
        required: false
        default: pending
        options:
          - { label: Beklemede, value: pending }
          - { label: Onaylandı ve Yayınlanacak, value: approved }
          - { label: Reddedildi, value: rejected }
      - { label: Başlık, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, readonly: true }
      - { label: Tarih, name: date, widget: string }
      - { label: Dil, name: language, widget: string, required: false, readonly: true }
      - { label: Ülke, name: country, widget: string, required: false, readonly: true }
      - label: Kategori
        name: category
        widget: select
        required: false
        options:
          - Son Dakika
          - Gündem
          - Siyaset
          - Ekonomi
          - Dünya
          - Spor
          - Magazin
          - Teknoloji
          - Sağlık
          - Video
      - { label: Spot, name: spot, widget: text, required: false }
      - { label: Özet, name: summary, widget: text, required: false }
      - { label: Haber Gövdesi HTML, name: content_html, widget: text, required: false }
      - { label: Görsel URL, name: image_url, widget: string, required: false }
      - { label: Görsel Alt Metni, name: image_alt, widget: string, required: false }
      - { label: Görsel Promptu, name: image_prompt, widget: text, required: false }
      - { label: Meta Title, name: meta_title, widget: string, required: false }
      - { label: Meta Description, name: meta_description, widget: text, required: false }
      - label: Discover Başlıkları
        name: discover_titles
        widget: list
        required: false
        field: { label: Başlık, widget: string }
      - label: Etiketler
        name: tags
        widget: list
        required: false
        field: { label: Etiket, widget: string }
      - label: Görsel Anahtar Kelimeleri
        name: visual_keywords
        widget: list
        required: false
        field: { label: Kelime, widget: string }
      - { label: URL Prefix, name: url_prefix, widget: string, required: false, readonly: true }
      - { label: Word Count, name: word_count, widget: number, required: false, readonly: true }
      - { label: Quality Score, name: quality_score, widget: number, required: false, readonly: true }
      - { label: Quality Status, name: quality_status, widget: string, required: false, readonly: true }
      - { label: Review Required, name: review_required, widget: boolean, required: false, readonly: true }
      - { label: Indexed On Home, name: indexed_on_home, widget: boolean, required: false, readonly: true }

  - name: published_tr
    label: "2.1 - Yayındaki Haberler / Türkçe"
    label_singular: "Yayındaki Türkçe Haber"
    folder: articles
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{date}} - {{title}}"
    fields: *base_fields

  - name: published_en
    label: "2.2 - Published News / English"
    label_singular: "Published English News"
    folder: news/articles
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{date}} - {{title}}"
    fields: *base_fields

  - name: published_de
    label: "2.3 - Veröffentlichte Nachrichten / Deutsch"
    label_singular: "Veröffentlichte Nachricht"
    folder: nachrichten/artikel
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{date}} - {{title}}"
    fields: *base_fields
