name: Publish Approved Review Articles

# ONAYLI İNCELEME HABERLERİNİ YAYINA ALMA WORKFLOW'U
#
# Ne yapar?
# - `review/pending/**/*.json` altında onay bekleyen haber JSON dosyalarını izler.
# - `tools/publish_approved_review.py` ile yalnızca onay durumu uygun haberleri
#   public site makale klasörlerine taşır/yayınlar.
# - Yayınlanan haberleri ve review durumunu commit/push yapabilir.
#
# Ne zaman çalışır?
# - `review/pending` altındaki JSON dosyaları main branch'e push edildiğinde çalışır.
# - `github-actions[bot]` kendi commit'iyle tekrar tetiklemesin diye koruma içerir.
#
# Yetki ve risk notu:
# - `contents: write` yetkisine sahiptir ve public siteye yazabilir.
# - Sadece onaylı review akışında kullanılmalıdır; otomatik haber üretim aracı değildir.

on:
  push:
    branches:
      - main
    paths:
      - "review/pending/**/*.json"

permissions:
  contents: write

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish approved review articles
        run: python tools/publish_approved_review.py

      - name: Commit published articles
        run: |
          git config user.name "Review Publish Bot"
          git config user.email "review-publish@hakancetin.com.tr"
          git add articles news nachrichten review haber.html
          git diff --staged --quiet || git commit -m "Publish approved review articles"
          git push
