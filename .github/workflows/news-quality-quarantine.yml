name: News Quality Quarantine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-quality-quarantine.yml'

permissions:
  contents: write

jobs:
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide weak articles from public index metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          canonical_categories = {
              'Son Dakika','Gündem','Siyaset','Ekonomi','Dünya','Spor','Magazin','Teknoloji','Sağlık','Video'
          }
          category_aliases = {
              'Dış Haberler': 'Dünya',
              'Dış haberler': 'Dünya',
              'Dis Haberler': 'Dünya',
              'Bilim': 'Teknoloji',
              'Yapay Zeka': 'Teknoloji',
              'Haberler': 'Gündem',
          }
          changed = []
          quarantined = []
          normalized = []
          for path in Path('articles').glob('*.json'):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              original = json.dumps(data, ensure_ascii=False, sort_keys=True)

              category = data.get('category')
              if category in category_aliases:
                  data['category'] = category_aliases[category]
                  normalized.append(path.name)

              word_count = int(data.get('word_count') or data.get('quality_word_count') or 0)
              score = int(data.get('quality_score') or 0)
              flags = set(data.get('quality_flags') or [])
              title = str(data.get('title') or '')
              summary = str(data.get('summary') or data.get('spot') or '')

              weak = (
                  word_count and word_count < 180
              ) or (
                  score and score < 68
              ) or (
                  'very_short_article' in flags
              ) or (
                  data.get('category') not in canonical_categories
              ) or (
                  len(summary.strip()) < 80
              )

              if weak and data.get('indexed_on_home') is not False:
                  data['indexed_on_home'] = False
                  data['review_status'] = 'needs_editorial_review'
                  notes = data.setdefault('quality_notes', [])
                  if isinstance(notes, list) and 'Auto-hidden from home by News Quality Quarantine.' not in notes:
                      notes.append('Auto-hidden from home by News Quality Quarantine.')
                  quarantined.append(path.name)

              updated = json.dumps(data, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n'
              if updated != original + '\n':
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          print('changed:', len(changed))
          print('normalized:', len(normalized))
          print('quarantined:', len(quarantined))
          for item in quarantined[:100]:
              print('quarantine', item)
          PY
      - name: Commit quarantine updates
        run: |
          git config user.name "News Quality Quarantine"
          git config user.email "news-quality-quarantine@users.noreply.github.com"
          git add articles/*.json
          if git diff --staged --quiet; then
            echo "No quarantine changes."
            exit 0
          fi
          git commit -m "Quarantine weak news metadata from home index"
          git push
