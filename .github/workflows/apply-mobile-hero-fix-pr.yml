name: Apply Mobile Hero Fix PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/mobile-hero-fix.trigger'

permissions:
  contents: write

jobs:
  apply-mobile-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Patch live homepage source on PR branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('haber/index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('class="member-login-btn" href="#"', 'class="member-login-btn" href="/login.html"')
          text = text.replace('      initMarketScroll();', '      /* mobile UX: currency auto-scroll removed */')
          text = re.sub(r'\n\s*/\* MOBILE_HERO_FIRST_UX_V2_START \*/.*?/\* MOBILE_HERO_FIRST_UX_V2_END \*/\n?', '\n', text, flags=re.S)
          text = re.sub(r'\n\s*<script id="mobile-hero-first-layout-v2">.*?</script>\n?', '\n', text, flags=re.S)
          css = '''
    /* MOBILE_HERO_FIRST_UX_V2_START */
    @media (max-width: 640px) {
      body { background: #fff; }
      .top-bar { display: none !important; }
      header { padding: 0 !important; background: #fff !important; border-bottom: 1px solid #e5e7eb !important; }
      header .inner { min-height: 52px; padding: 7px 10px !important; display: flex !important; flex-flow: row nowrap !important; align-items: center !important; gap: 6px !important; }
      .logo { flex: 1 1 auto; min-width: 0; gap: 6px !important; }
      .logo-icon { width: 33px !important; height: 33px !important; min-width: 33px !important; border-radius: 7px !important; font-size: 1.08rem !important; }
      .logo-text strong { font-size: .93rem !important; line-height: 1 !important; white-space: nowrap !important; }
      .logo-text span { display: none !important; }
      .header-tools { flex: 0 0 auto; width: auto !important; margin-left: auto !important; display: flex !important; align-items: center !important; gap: 5px !important; }
      .header-search, .header-search.is-open { width: 36px !important; min-width: 36px !important; height: 36px !important; border-radius: 7px !important; overflow: hidden !important; }
      .header-search input { width: 36px !important; opacity: 0 !important; padding: 0 !important; }
      .header-search:focus-within { position: absolute !important; left: 10px; right: 10px; width: auto !important; z-index: 50; background: #fff !important; }
      .header-search:focus-within input { width: 100% !important; opacity: 1 !important; padding: 8px 36px !important; }
      .member-login-btn { min-height: 36px !important; padding: 0 9px !important; font-size: .73rem !important; border-radius: 7px !important; box-shadow: none !important; }
      header .inner > nav { display: none !important; }
      .breaking { min-height: 38px !important; background: #fff !important; border-top: 0 !important; border-bottom: 2px solid #df0909 !important; }
      .breaking .inner { padding: 0 !important; display: block !important; }
      .breaking-label { display: none !important; }
      .topic-list { display: flex !important; gap: 0 !important; align-items: center !important; overflow-x: auto !important; white-space: nowrap !important; padding: 0 4px !important; scrollbar-width: none !important; }
      .topic-list::-webkit-scrollbar { display: none !important; }
      .topic-link { padding: 10px 9px 8px !important; border-radius: 0 !important; border: 0 !important; color: #212529 !important; background: transparent !important; font-size: .78rem !important; font-weight: 700 !important; }
      .topic-link.primary, .topic-link.active, .topic-link.is-active { color: #df0909 !important; border-bottom: 3px solid #df0909 !important; }
      .container { padding: 7px 10px 20px !important; }
      .page-layout, .showcase-grid { display: block !important; }
      .showcase-header { display: none !important; }
      .headline-slider { height: 402px !important; min-height: 0 !important; margin: 0 !important; border-radius: 9px !important; }
      .headline-card, .headline-image { height: 402px !important; min-height: 0 !important; border-radius: 9px !important; }
      .headline-content { padding: 13px 14px 16px !important; }
      .headline-title { font-size: 1.34rem !important; line-height: 1.14 !important; }
      .headline-meta { margin-bottom: 7px !important; }
      body:not(.mobile-hero-ready) .market-strip { display: none !important; }
      body.mobile-hero-ready .market-strip {
        margin: 9px 0 14px !important; width: 100% !important; max-width: none !important;
        display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 5px !important; padding: 6px !important; overflow: visible !important;
        white-space: normal !important; border: 1px solid #e4e7ec !important;
        border-radius: 9px !important; background: #f7f8fa !important; scroll-snap-type: none !important;
      }
      .market-label { display: none !important; }
      .market-item, .market-item.up, .market-item.down {
        width: 100% !important; min-width: 0 !important; padding: 6px 7px !important;
        display: grid !important; grid-template-columns: minmax(0, 1fr) auto !important;
        gap: 3px 5px !important; align-items: center !important;
        background: #fff !important; border: 1px solid #e9ecf1 !important;
        border-radius: 6px !important; box-shadow: none !important;
      }
      .market-name { color: #667085 !important; font-size: .62rem !important; font-weight: 700 !important; }
      .market-value, .market-item.up .market-value, .market-item.down .market-value { color: #101828 !important; font-size: .84rem !important; min-width: 0 !important; }
      .market-change, .market-item.up .market-change, .market-item.down .market-change {
        grid-column: 2 !important; grid-row: 1 / span 2 !important; min-width: 0 !important;
        padding: 3px 5px !important; border-radius: 999px !important;
        font-size: .6rem !important; font-weight: 700 !important;
        color: #b42318 !important; background: #fff1f0 !important;
      }
      .market-status { grid-column: 1 / -1 !important; display: block !important; padding: 1px 3px 0 !important; font-size: .61rem !important; color: #667085 !important; white-space: normal !important; }
    }
    /* MOBILE_HERO_FIRST_UX_V2_END */
'''
          text = text.replace('</style>', css + '  </style>', 1)
          script = '''
  <script id="mobile-hero-first-layout-v2">
    (function () {
      var market = document.querySelector('.market-strip');
      var hero = document.querySelector('.headline-slider');
      if (!market || !hero) return;
      var marker = document.createComment('market-desktop-position');
      market.parentNode.insertBefore(marker, market);
      var mq = window.matchMedia('(max-width: 640px)');
      function applyLayout() {
        if (mq.matches) {
          hero.insertAdjacentElement('afterend', market);
          document.body.classList.add('mobile-hero-ready');
        } else {
          if (marker.parentNode) marker.parentNode.insertBefore(market, marker.nextSibling);
          document.body.classList.remove('mobile-hero-ready');
        }
      }
      applyLayout();
      if (mq.addEventListener) mq.addEventListener('change', applyLayout);
    })();
  </script>
'''
          text = text.replace('</body>', script + '</body>', 1)
          p.write_text(text, encoding='utf-8')
          assert 'MOBILE_HERO_FIRST_UX_V2' in text
          assert 'mobile UX: currency auto-scroll removed' in text
          PY
      - name: Commit patched HTML to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "Mobile UX Patch"
          git config user.email "mobile-ux-patch@users.noreply.github.com"
          git add haber/index.html
          git diff --cached --exit-code && exit 0
          git commit -m "Apply mobile hero-first homepage layout"
          git push origin HEAD:${HEAD_REF}
