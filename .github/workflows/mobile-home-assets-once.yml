name: Mobile Home Assets Once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mobile-home-assets-once.yml']
permissions:
  contents: write
jobs:
  edit-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('haber/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/assets/css/mobile-home-ux.css?v=20260525c', '/assets/css/mobile-home-ux.css?v=20260525d')
          s = s.replace('/assets/js/mobile-home-ux.js?v=20260525c', '/assets/js/mobile-home-ux.js?v=20260525d')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "Mobile Home Fix"
          git config user.email "mobile-home-fix@users.noreply.github.com"
          git add haber/index.html
          git diff --cached --quiet || git commit -m "Refresh mobile homepage assets"
          git push
