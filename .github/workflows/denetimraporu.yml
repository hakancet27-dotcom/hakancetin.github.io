name: denetimraporu

# Sadece denetim raporu üretir.
# Site dosyalarını değiştirmez, commit atmaz, push yapmaz; raporu artifact ve step summary olarak saklar.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1,4"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run site quality audit
        run: python tools/site_quality_audit.py

      - name: Write audit summary
        if: always()
        run: |
          if [ -f reports/site-quality-audit.md ]; then
            cat reports/site-quality-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denetimraporu
          path: reports/
          retention-days: 14
