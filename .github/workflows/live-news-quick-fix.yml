name: Live News Quick Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-news-quick-fix.yml'

permissions:
  contents: write

jobs:
  quick-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe live news text and navigation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'Tartşıyor': 'Tartışıyor',
              'Tart\u015f\u0131yor': 'Tartışıyor',
              '?ne ??kan': 'Öne Çıkan',
              '?ne Çıkan': 'Öne Çıkan',
              'Guncelleniyor': 'Güncelleniyor',
              'Yukleniyor': 'Yükleniyor',
              'Uye Girişi': 'Üye Girişi',
          }
          mobile_fix = '''
    /* MOBILE_MARKET_NO_OVERFLOW_V2 */
    @media (max-width: 640px) {
      .market-strip { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px !important; width: 100%; overflow: visible !important; white-space: normal !important; padding: 8px !important; }
      .market-label, .market-status { grid-column: 1 / -1; }
      .market-status { display: block !important; }
      .market-item { width: 100%; min-width: 0 !important; padding: 8px !important; display: flex !important; flex-wrap: wrap; gap: 4px 6px !important; }
      .market-name { width: 100%; }
      .market-value, .market-change { min-width: 0 !important; }
    }
'''

          html_paths = list(Path('.').glob('**/*.html')) + list(Path('.').glob('**/*.xml')) + list(Path('.').glob('**/*.json'))
          changed = []
          for path in html_paths:
              if '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.as_posix() == 'haber/index.html':
                  text = text.replace('class="member-login-btn" href="#"', 'class="member-login-btn" href="/login.html"')
                  text = text.replace('id="market-usd">--</strong>', 'id="market-usd">40,75</strong>')
                  text = text.replace('id="market-eur">--</strong>', 'id="market-eur">47,70</strong>')
                  text = text.replace('id="market-gbp">--</strong>', 'id="market-gbp">55,80</strong>')
                  text = text.replace('id="market-btc">--</strong>', 'id="market-btc">4,35 Mn</strong>')
                  text = text.replace('id="market-usd-change">--</span>', 'id="market-usd-change">Beklemede</span>')
                  text = text.replace('id="market-eur-change">--</span>', 'id="market-eur-change">Beklemede</span>')
                  text = text.replace('id="market-gbp-change">--</span>', 'id="market-gbp-change">Beklemede</span>')
                  text = text.replace('id="market-btc-change">--</span>', 'id="market-btc-change">Beklemede</span>')
                  text = text.replace('id="market-status">Güncelleniyor</span>', 'id="market-status">Canlı veri yükleniyor</span>')
                  if 'MOBILE_MARKET_NO_OVERFLOW_V2' not in text:
                      text = text.replace('</style>', mobile_fix + '  </style>', 1)
                  text = text.replace('      initMarketScroll();', '      /* Auto-scrolling market strip disabled for stable mobile layout. */')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())
          print('\n'.join(changed) if changed else 'No changes needed')
          PY
      - name: Commit safe live quick fixes
        run: |
          git config user.name "Live News Quick Fix"
          git config user.email "live-news-quick-fix@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No quick fixes to commit."
            exit 0
          fi
          git commit -m "Apply live news quick fixes"
          git push
