name: denitimraporu

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1,4"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run site quality audit
        run: python tools/site_quality_audit.py

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: denetimraporu
          path: reports/
          retention-days: 14
