<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="hakancetin.com.tr video haber merkezi: g&uuml;ndem, son dakika ve d&uuml;nya haber videolar&inodot;.">
  <title>Video Haber | hakancetin.com.tr</title>
  <style>
    :root { --red:#e10600; --dark:#121525; --muted:#a8b0c2; --card:#1b2033; --border:#2b3147; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Segoe UI, Arial, sans-serif; background:#0f1220; color:#fff; }
    .top { background:#fff; color:#171729; border-bottom:3px solid var(--red); }
    .top .inner { max-width:1100px; margin:0 auto; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    a { color:inherit; text-decoration:none; }
    .brand { font-weight:900; }
    .back { color:var(--red); font-weight:900; }
    .wrap { max-width:1100px; margin:28px auto; padding:0 18px; }
    .hero { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:18px; align-items:start; }
    .player-card, .playlist-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:0 20px 48px rgba(0,0,0,.25); }
    h1 { margin:0 0 10px; font-size:clamp(1.5rem,3vw,2.4rem); }
    .source-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; color:var(--muted); }
    .source-chip { display:inline-flex; align-items:center; gap:8px; color:#fff; background:rgba(225,6,0,.18); border:1px solid rgba(225,6,0,.45); border-radius:999px; padding:8px 12px; font-weight:800; }
    .channel-btn { display:inline-flex; align-items:center; justify-content:center; background:var(--red); color:#fff; border-radius:999px; padding:9px 13px; font-weight:900; }
    .player { width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:#000; }
    .playlist { display:grid; gap:10px; }
    .video-link { display:grid; grid-template-columns:86px 1fr; gap:10px; align-items:center; padding:8px; border-radius:10px; background:#121827; border:1px solid transparent; }
    .video-link:hover, .video-link.active { border-color:var(--red); background:#211624; }
    .thumb { aspect-ratio:16/9; border-radius:8px; display:grid; place-items:center; background:linear-gradient(135deg, #e10600, #a80000); font-weight:900; }
    .video-link strong { display:block; font-size:.96rem; }
    .video-link small { color:var(--muted); }
    @media (max-width:850px){ .hero{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="top"><div class="inner"><a class="brand" href="haber/">hakancetin.com.tr</a><a class="back" href="haber/">&larr; Haberler</a></div></div>
  <main class="wrap">
    <section class="hero">
      <div class="player-card">
        <h1 id="video-title">Video Haber</h1>
        <div class="source-bar">
          <span class="source-chip">Kaynak: <strong>Nartanesi Haber</strong></span>
          <a class="channel-btn" href="https://www.youtube.com/@NartanesiHaber" target="_blank" rel="noopener">YouTube Kanalı</a>
        </div>
        <iframe id="player" class="player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
      </div>
      <aside class="playlist-card">
        <h2 style="margin:0 0 12px;font-size:1rem;">Video Haberler</h2>
        <div class="playlist" id="playlist"></div>
      </aside>
    </section>
  </main>
  <script>
    const CHANNEL = {
      name: 'Nartanesi Haber',
      url: 'https://www.youtube.com/@NartanesiHaber'
    };
    const videos = [
      {id:'_JlZOhyX_5U', title:'Nartanesi Haber Videosu', meta:'Kaynak: Nartanesi Haber', source: CHANNEL.url}
    ];
    const params = new URLSearchParams(location.search);
    const requested = (params.get('v') || videos[0].id).replace(/[^a-zA-Z0-9_-]/g, '');
    function render(id){
      const item = videos.find(v => v.id === id) || videos[0];
      document.getElementById('video-title').textContent = item.title;
      document.getElementById('player').src = `https://www.youtube.com/embed/${item.id}`;
      document.querySelectorAll('.video-link').forEach(a => a.classList.toggle('active', a.dataset.id === item.id));
      history.replaceState(null, '', '?v=' + encodeURIComponent(item.id));
    }
    const list = document.getElementById('playlist');
    videos.forEach(v => {
      const a = document.createElement('a');
      a.href = '?v=' + encodeURIComponent(v.id);
      a.className = 'video-link';
      a.dataset.id = v.id;
      a.innerHTML = `<span class="thumb">&#9654;</span><span><strong>${v.title}</strong><small>${v.meta}</small></span>`;
      a.addEventListener('click', e => { e.preventDefault(); render(v.id); });
      list.appendChild(a);
    });
    ['Kanal videosu', 'Son yüklenenler'].forEach((title) => {
      const a = document.createElement('a');
      a.href = CHANNEL.url;
      a.className = 'video-link';
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<span class="thumb">&#9654;</span><span><strong>${title}</strong><small>Kaynak: ${CHANNEL.name}</small></span>`;
      list.appendChild(a);
    });
    render(requested);
  </script>
</body>
</html>
